# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]

# MonoGame.Xna.Framework.Net is published to this account's GitHub Packages feed, which needs a token to read.
permissions:
  contents: read
  packages: read

env:
  DotnetVersion: 10.0.x
  # The feed the networking library (MonoGame.Xna.Framework.Net) is published to. The default token can read it
  # once the package's "Manage Actions access" lists this repository; otherwise add a PACKAGES_TOKEN secret
  # (a personal access token with read:packages) and it is used instead.
  PackagesFeed: https://nuget.pkg.github.com/CartBlanche/index.json

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DotnetVersion }}

    - name: Add the GitHub Packages feed
      run: dotnet nuget add source "$PackagesFeed" --name github-cartblanche --username "${{ github.repository_owner }}" --password "${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}" --store-password-in-clear-text
      shell: bash

    - name: Test
      run: dotnet test Tests/VectorRumble.Tests/VectorRumble.Tests.csproj -c Release

  build:
    name: build-${{ matrix.os }} ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: -r win-x64
            artifact: publish-win-x64
          - os: windows-latest
            args: -r win-arm64
            artifact: publish-win-arm64
          - os: macos-latest
            args: -rids osx-arm64,osx-x64 --macos-universal
            artifact: publish-osx-universal
            wineprefix: /Users/runner/.winemonogame
          - os: ubuntu-latest
            args: -r linux-x64
            artifact: publish-linux-x64
            wineprefix: /home/runner/.winemonogame
      fail-fast: false
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DotnetVersion }}
    - name: Setup for MonoGame
      uses: monogame/monogame-actions/install-wine@v1.0.3
    - name: Setup Java JDK
      uses: actions/setup-java@v6
      with:
        distribution: 'microsoft'
        java-version: '17'
    - name: Install .NET Android workload
      run: dotnet workload install android
    - name: Add the GitHub Packages feed
      run: dotnet nuget add source "$PackagesFeed" --name github-cartblanche --username "${{ github.repository_owner }}" --password "${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}" --store-password-in-clear-text
      shell: bash
    - name: Restore dependencies
      run: dotnet restore
    - name: Restore tools
      run: dotnet tool restore
    - name: Update Path
      if: runner.os != 'Windows'
      run: |
        echo "/opt/homebrew/lib:/usr/local/lib:/usr/local/bin" >> $GITHUB_PATH
      shell: bash
    - name: Build
      run: |
        echo $DYLD_LIBRARY_PATH
        dotnet build Desktop/VectorRumble.csproj -c Release -v:diag -tl:off
      shell: bash
      env:
        MGFXC_WINE_PATH: ${{ matrix.wineprefix }}
        DYLD_LIBRARY_PATH: /usr/lib:/usr/local/lib:/opt/homebrew/lib:/usr/local/bin:$DYLD_LIBRARY_PATH
    - name: Package
      run: dotnet monopack -p Desktop/VectorRumble.csproj -z -o ./${{ matrix.artifact }} ${{ matrix.args }} -i ./Info.plist -c ./VectorRumble.icns -v
      shell: bash
      env:
        MGFXC_WINE_PATH: ${{ matrix.wineprefix }}
    - name: Upload
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.artifact }}
        path: ./${{ matrix.artifact }}/*.zip

  # Windows builds the shaders natively, so unlike the macOS and Linux builds above this one needs no Wine
  build-android:
    name: build-android-apk
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v5

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DotnetVersion }}

    - name: Setup Java JDK
      uses: actions/setup-java@v6
      with:
        distribution: 'microsoft'
        java-version: '17'

    - name: Install .NET Android workload
      run: dotnet workload install android

    - name: Add the GitHub Packages feed
      run: dotnet nuget add source "$env:PackagesFeed" --name github-cartblanche --username "${{ github.repository_owner }}" --password "${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}" --store-password-in-clear-text
      shell: pwsh

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Android APK
      run: dotnet build Android/VectorRumble.csproj -c Release

    - name: Upload APK
      uses: actions/upload-artifact@v6
      with:
        name: publish-android-apk
        path: Android/bin/Release/net10.0-android/*-Signed.apk

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: windows
            rid: win-x64
            artifact: publish-win-x64
            archive: .zip
          - os: macos
            rid: universal
            artifact: publish-osx-universal
            archive: .zip
          - os: linux
            rid: linux-x64
            artifact: publish-linux-x64
            archive: .zip
      fail-fast: false
    needs: build
    steps:
      - name: Download
        uses: actions/download-artifact@v6
        with:
          name: ${{ matrix.artifact }}
      - name: Extract
        run: |
              7z x ./VectorRumble-${{ matrix.rid }}${{ matrix.archive }} -o./${{ matrix.rid }} -y
              find .
        shell: bash
      - name: Publish
        uses: monogame/monogame-actions/publish-itchio@v1.0.3
        with:
          channel: ${{ matrix.os }}
          tag: '-alpha'
          version: ${{ github.ref_name }}
          file: './${{ matrix.rid }}/'
          ITCHIO_USER: ${{ secrets.ITCHIO_USER }}
          ITCHIO_GAME: ${{ secrets.ITCHIO_GAME }}
          ITCHIO_TOKEN: ${{ secrets.BUTLER_API_KEY }}
